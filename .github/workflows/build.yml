name: Build FitTrack APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FitTrack project
        run: |
          mkdir build-project
          unzip -q FitTrack-GitHub-Ready.zip -d build-project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: build-project/FitTrack
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-debug-apk
          path: build-project/FitTrack/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
